name: Deploy to Itch.io

on:
  push:
    tags:
      - '*'

env:
  BUTLER_API_KEY: ${{secrets.ITCHIO_API_KEY}}
  ITCHIO_USERNAME: ${{secrets.ITCHIO_USERNAME}}
  PROJECT_NAME: "2d-slimes-roguelike"

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Get Godot Version
        run: echo "GODOT_VERSION=$(grep '^config/features' project.godot | cut -d "\"" -f 2)" >> $GITHUB_ENV

      - name: Download Godot
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip
          unzip godot.zip
          mv Godot_v$GODOT_VERSION-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download Godot Export Templates
        run: |
          curl -L -o export_templates.zip https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz
          unzip export_templates.zip

      - name: Install Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/$GODOT_VERSION.stable
          mv ./templates/* ~/.local/share/godot/export_templates/$GODOT_VERSION.stable

      - name: Build
        run: |
          mkdir -p exports/html
          ./godot --headless --export-release "Web" exports/html/index.html
          ./godot --headless --export-release "Windows Desktop" exports/$PROJECT_NAME_$GITHUB_REF_NAME_x86-64.exe

      - name: Zip HTML Export
        run: |
          cd exports/html
          zip $GITHUB_REF_NAME.zip -r -m *
          mv $GITHUB_REF_NAME.zip ..
          cd -

      - name: LSing
        run: |
          ls exports
          ls

      - name: Save Artifacts for Next Job
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: exports

  Publish:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v4
        with:
          name: exports
          path: exports

      - name: Download Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Login To Butler
        run: ./butler login

      - name: Push To Itch
        run: |
          ./butler push ./exports/$GITHUB_REF_NAME.zip $ITCHIO_USERNAME/$PROJECT_NAME:html
          ./butler push ./exports/$PROJECT_NAME_$GITHUB_REF_NAME_x86-64.exe $ITCHIO_USERNAME/$PROJECT_NAME:windows

